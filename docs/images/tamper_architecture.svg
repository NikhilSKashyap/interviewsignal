<svg width="1000" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d1117" rx="10"/>
  
  <!-- Connections -->
  <line x1="200" y1="125" x2="350" y2="125" stroke="#30363d" stroke-width="4" stroke-dasharray="8,8"/>
  <line x1="550" y1="125" x2="700" y2="125" stroke="#30363d" stroke-width="4" stroke-dasharray="8,8"/>
  
  <!-- Node 1: Prompt -->
  <rect x="50" y="85" width="150" height="80" rx="10" fill="#238636" stroke="#ffffff" stroke-width="2"/>
  <text x="125" y="125" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Prompt</text>
  
  <!-- Label 1 -->
  <text x="275" y="105" font-family="monospace" font-size="14" fill="#8b949e" text-anchor="middle">SHA-256 Lock</text>
  
  <!-- Node 2: Tool Call -->
  <rect x="350" y="85" width="200" height="80" rx="10" fill="#1f6feb" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="125" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">AI Tool Call</text>
  
  <!-- Label 2 -->
  <text x="625" y="105" font-family="monospace" font-size="14" fill="#8b949e" text-anchor="middle">Hash Chain</text>
  
  <!-- Node 3: Git Commit -->
  <rect x="700" y="85" width="250" height="80" rx="10" fill="#8957e5" stroke="#ffffff" stroke-width="2"/>
  <text x="825" y="115" font-family="sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Git Commit</text>
  <text x="825" y="140" font-family="sans-serif" font-size="14" fill="#c9d1d9" text-anchor="middle" dominant-baseline="middle">Cross-verified to event log</text>
</svg>