  <circle cx="1000" cy="260" r="150" fill="#4f46e5" opacity="0.04"/>
  <circle cx="600" cy="260" r="200" fill="#818cf8" opacity="0.02"/>

  <!-- ==================== STEP 1: Share Code ==================== -->

